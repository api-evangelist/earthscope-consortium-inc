description: 'EarthScope Consortium, Inc. is a university consortium dedicated to transforming global geophysical research and education. It operates NSF’s GAGE and SAGE facilities, providing data and tools for seismology, geodesy, and earth science research, and supports collaborative projects across academia and industry.'

